site_name: Market Bot
site_description: Market Bot - algorithmic trading system documentation
site_author: Market Bot Team
site_url: https://your-username.gitlab.io/ai-trade-bot/

repo_name: ai-trade-bot
repo_url: https://gitlab.com/your-username/ai-trade-bot

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.code.select
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/favicon.ico
  logo: assets/logo.svg

plugins:
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            "Quick Start": "Быстрый старт"
            "What is Market Bot?": "Что такое Market Bot?"
            "User Guide": "Руководство пользователя"
            Configuration: Конфигурация
            "Broker Setup": "Настройка брокеров"
            Strategies: Стратегии
            "Grid Bot": Grid Bot
            "Developer Guide": Разработчикам
            "API Documentation": "API документация"
  - search:
      lang:
        - ru
        - en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: date
      locale: ru
  - mermaid2:
      version: 9.4.3

nav:
  - Home: index.md
  - Quick Start:
    - "What is Market Bot?": getting-started/what-is.md
    - "Quick Start": getting-started/quickstart.md
  - User Guide:
    - Configuration: user-guide/configuration.md
    - "Broker Setup": user-guide/broker-setup.md
    - "FAQ": user-guide/faq.md
  - Strategies:
    - "Grid Bot": strategies/grid-bot.md
    - "AI Strategy": strategies/ai-strategy.md
    - "Gates Strategy": strategies/gates-strategy.md
  - Developer Guide:
    - "API Documentation": developer-guide/api.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: dark0ghost
      repo: ai-trade-bot
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append: []
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dark0ghost/ai-trade-bot
    - icon: fontawesome/brands/telegram
      link: https://t.me/ai_trade_bot
