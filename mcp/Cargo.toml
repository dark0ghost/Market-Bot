[package]
name = "mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git"}
tokio = "1.44.2"
anyhow = "1.0.97"
reqwest = "0.12.15"
image = "0.25.6"
tokio-stream = "0.1.17"
# https://github.com/pepperoni21/ollama-rs?tab=readme-ov-file#create-a-custom-tool
ollama-rs = { version = "0.3.1", features = ["stream", "macros"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3.12.0", optional = true }
schemars = { version = "0.8.22", features = ["preserve_order"] }
