model:
  name: "ProsusAI/finbert"
  num_labels: 3
  max_length: 128
  labels: ["negative", "neutral", "positive"]

training:
  batch_size: 16
  epochs: 4
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  output_dir: "models/finbert"
  dataset: "financial_phrasebank"
  dataset_config: "sentences_allagree"
  train_test_split: 0.8
  seed: 42

onnx:
  output_path: "models/finbert/model.onnx"
  opset: 14
