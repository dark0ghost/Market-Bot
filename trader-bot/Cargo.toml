[package]
name = "trader-bot"
edition = "2024"
license-file = "../LICENSE"
version.workspace = true

[lib]
name = "trader_bot"
path = "src/lib.rs"

[[bin]]
name = "trader-bot"
path = "src/main.rs"

[dependencies]
t-invest-sdk = "0.14.0"
mcp-client = { workspace = true }
ollama-rs = { version = "0.3.1", features = ["stream", "macros", "tool-implementations"] }
tokio = { version = "1.42.0", features = ["full"] }
flume = "0.11.1"
anyhow = "1.0.95"
thiserror = "2.0"
serde = { version = "1.0.219", features = ["derive"] }
tonic = "0.13.0"
serde_json = "1"
serde_with = { version = "3.12.0", optional = true }
schemars = { version = "0.8.22", features = ["preserve_order"] }
reqwest = { version = "0.12.9", features = ["json"] }
ta = "0.5.0"
chrono = { version = "0.4.38", features = ["serde"] }
log = "0.4.22"
env_logger = "0.11.5"
prost-types = "0.14"