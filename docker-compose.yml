services:
  ollama:
    build:
      context: ollama
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-fin-expert}
      - OLLAMA_BASE_MODEL=${OLLAMA_BASE_MODEL:-martain7r/finance-llama-8b}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  train:
    build:
      context: .
      dockerfile: training/finbert_sft/Dockerfile
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICE:-0}
    volumes:
      - .:/workspace
      - huggingface_cache:/root/.cache/huggingface
    working_dir: /workspace
    shm_size: 8g
    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          memory: 4g

volumes:
  ollama_models:
  huggingface_cache:
