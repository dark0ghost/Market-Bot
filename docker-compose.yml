services:
  # ─── Layer 2: LLM & Context ────────────────────────────────────────────
  ollama:
    build: ollama-mcp/
    ports:
      - "11435:11434"
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    container_name: trade-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ─── Layer 3: Data Collection ──────────────────────────────────────────
  data-collector:
    build:
      context: .
      dockerfile: training/data_collection/Dockerfile
    container_name: trade-collector
    volumes:
      - ./training/data_collected:/app/data_collected
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    depends_on:
      - ollama
      - redis
    restart: unless-stopped

volumes:
  ollama_data:
  redis_data:
