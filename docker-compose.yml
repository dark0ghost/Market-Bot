services:
  train:
    build:
      context: .
      dockerfile: training/finbert_sft/Dockerfile
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICE:-0}
    volumes:
      - .:/workspace
      - huggingface_cache:/root/.cache/huggingface
    working_dir: /workspace
    shm_size: 8g
    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          memory: 4g

volumes:
  huggingface_cache:
